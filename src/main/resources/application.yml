# Common configuration. Credentials and commercial limits come exclusively
# from the environment (PRD 8.6); placeholders have no default values so a
# missing variable fails the startup instead of falling back silently.
spring:
  application:
    name: trevo4folhas
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Flyway technical history lives in its own schema, apart from the domain
    # schema (AGENTS.md / DBA profile). Domain DDL is schema-qualified as
    # public.* in the migrations, so this never depends on search_path.
    default-schema: t4f_flyway
    schemas: t4f_flyway,public
    create-schemas: true

# Session configuration lives under the Boot contract server.servlet.session
# (the probe SessionConfigurationBindingProbeTest guards the binding).
server:
  servlet:
    session:
      # RNF-07: 30-minute inactivity timeout; cookies are HttpOnly and SameSite=Lax
      # everywhere, with Secure in the production posture. The local profile relaxes
      # Secure so plain-HTTP development keeps working (security profile rule 12).
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: true

trevo:
  betting:
    min-stake-amount: ${MIN_STAKE_AMOUNT}
    max-stake-amount: ${MAX_STAKE_AMOUNT}
    max-selections: ${MAX_SELECTIONS}
    max-potential-return: ${MAX_POTENTIAL_RETURN}
    ticket-validity-minutes: ${TICKET_VALIDITY_MINUTES}
  catalog:
    bank-time-zone: ${BANK_TIME_ZONE:America/Sao_Paulo}
    # Empty disables contact; never ship a fake or personal default number.
    bank-whatsapp-number: ${BANK_WHATSAPP_NUMBER:}
  security:
    login-rate-limit:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
  admin:
    # Controlled one-shot bootstrap of the first operator (PRD RF-16). The values
    # come only from the deployment environment and have no default credential:
    # empty means "no bootstrap requested". They are never logged or exposed.
    bootstrap:
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
