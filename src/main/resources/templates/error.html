<!doctype html>
<!-- TREVO4FOLHAS — erro genérico em pt-BR (sem stack trace nem detalhe interno). -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Erro — TREVO4FOLHAS</title>
    <link rel="stylesheet" href="/css/app.css" th:href="@{/css/app.css}" />
  </head>
  <body class="min-h-screen bg-slate-950 font-sans text-slate-100">
    <main class="mx-auto max-w-2xl p-4 sm:p-6">
      <h1 class="text-2xl font-semibold text-slate-100">
        Não foi possível concluir a solicitação
      </h1>
      <p class="mt-3 text-sm text-slate-400">
        Ocorreu um erro ao processar esta página. Tente novamente. Se o problema
        continuar, entre em contato com a banca.
      </p>
      <p class="mt-2 text-sm text-slate-500">
        Status: <span th:text="${status}">500</span>
      </p>
      <a
        class="mt-6 inline-block rounded-xl bg-emerald-500 px-4 py-3 font-semibold text-slate-950"
        th:href="@{/}"
        >Voltar ao início</a
      >
    </main>
  </body>
</html>
