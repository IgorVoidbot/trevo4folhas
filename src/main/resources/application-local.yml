# Local development profile only. Values below are development parameters
# registered in docs/planning/prd-1.2-contract-sync.md, never production
# acceptance. DB_USERNAME and DB_PASSWORD still come from the environment;
# there is no default credential in this repository.
spring:
  config:
    # Local-only .properties syntax; no shell execution or dependency required.
    import: optional:file:${TREVO_ENV_FILE:.env}[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trevo4folhas}

server:
  servlet:
    session:
      cookie:
        # Local development runs over plain HTTP; Secure is a production-profile
        # concern only (RNF-07). HttpOnly and SameSite stay as in the base config.
        secure: false

trevo:
  betting:
    min-stake-amount: ${MIN_STAKE_AMOUNT:5.00}
    max-stake-amount: ${MAX_STAKE_AMOUNT:500.00}
    max-selections: ${MAX_SELECTIONS:10}
    max-potential-return: ${MAX_POTENTIAL_RETURN:10000.00}
    ticket-validity-minutes: ${TICKET_VALIDITY_MINUTES:30}

logging:
  level:
    com.trevo4folhas: DEBUG
